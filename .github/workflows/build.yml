name: Build NX-Shell

on:
  push:
    branches: [master, main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a release'
        required: false
        type: boolean
        default: false
      version:
        description: 'Release version (required if creating release, e.g., 5.0.0)'
        required: false
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    
    outputs:
      is_release: ${{ steps.version.outputs.is_release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Validate release inputs
        if: github.event.inputs.release == 'true'
        run: |
          if [ -z "${{ github.event.inputs.version }}" ]; then
            echo "Error: Version is required when creating a release"
            exit 1
          fi
          if ! echo "${{ github.event.inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Version must be in format x.y.z (e.g., 5.0.0)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version and repository
        id: version
        env:
          INPUT_RELEASE: ${{ github.event.inputs.release }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "Debug: INPUT_RELEASE='${INPUT_RELEASE}'"
          echo "Debug: INPUT_VERSION='${INPUT_VERSION}'"
          echo "Debug: GITHUB_REF='${GITHUB_REF}'"
          echo "Debug: GITHUB_REPOSITORY='${GITHUB_REPOSITORY}'"
          
          IS_RELEASE="false"
          VERSION=""
          
          # Check for manual release trigger
          if [ "${INPUT_RELEASE}" = "true" ] && [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
            IS_RELEASE="true"
            echo "Manual release triggered with version: ${VERSION}"
          # Check for tag push
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            IS_RELEASE="true"
            echo "Tag push detected with version: ${VERSION}"
          else
            echo "Development build - no release"
          fi
          
          # Extract repository owner and name for update checks
          # This allows forks to automatically check their own releases
          REPO_OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          echo "Repository: ${REPO_OWNER}/${REPO_NAME}"
          
          echo "is_release=${IS_RELEASE}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "repo_owner=${REPO_OWNER}" >> $GITHUB_OUTPUT
          echo "repo_name=${REPO_NAME}" >> $GITHUB_OUTPUT
          
          if [ -n "$VERSION" ]; then
            echo "cmake_version_flag=-DPROJECT_VERSION_OVERRIDE=${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "cmake_version_flag=" >> $GITHUB_OUTPUT
          fi
          
          echo "Final: is_release=${IS_RELEASE}, version=${VERSION}"

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            ${{ steps.version.outputs.cmake_version_flag }} \
            -DGITHUB_REPO_OWNER=${{ steps.version.outputs.repo_owner }} \
            -DGITHUB_REPO_NAME=${{ steps.version.outputs.repo_name }}

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Copy NRO to root (for act/deploy.ps1)
        run: |
          cp build/NX-Shell.nro NX-Shell.nro || true
          ls -lh NX-Shell.nro

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: ${{ !env.ACT }}
        with:
          name: NX-Shell
          path: build/NX-Shell.nro
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: NX-Shell
          path: dist/

      - name: Generate changelog
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          
          # Check for previous tag to generate changelog
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "## What's New in v${VERSION}" > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "### Changes since ${PREV_TAG}:" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges >> RELEASE_NOTES.md || true
            echo "" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "---" >> RELEASE_NOTES.md
          fi
          
          echo "### Installation" >> RELEASE_NOTES.md
          echo "1. Download \`NX-Shell.nro\`" >> RELEASE_NOTES.md
          echo "2. Copy to \`/switch/NX-Shell/\` on your SD card" >> RELEASE_NOTES.md
          echo "3. Launch from the Homebrew Menu" >> RELEASE_NOTES.md
          
          cat RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NX-Shell ${{ needs.build.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: dist/NX-Shell.nro
          fail_on_unmatched_files: true
