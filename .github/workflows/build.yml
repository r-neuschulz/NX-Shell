name: Build NX-Shell

on:
  push:
    branches: [master, main, 'renovate/**']
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a release'
        required: false
        type: boolean
        default: false
      version:
        description: 'Release version (required if creating release, e.g., 5.0.0)'
        required: false
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  # Setup job reads dependencies.json to get the Docker image tag
  # This allows dependencies.json to be the single source of truth
  setup:
    runs-on: ubuntu-latest
    outputs:
      docker_image: ${{ steps.read_deps.outputs.docker_image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: dependencies.json
          sparse-checkout-cone-mode: false

      - name: Read Docker image from dependencies.json
        id: read_deps
        run: |
          DOCKER_IMAGE=$(jq -r '.system_packages.devkitpro.docker_image' dependencies.json)
          DOCKER_TAG=$(jq -r '.system_packages.devkitpro.docker_tag' dependencies.json)
          echo "docker_image=${DOCKER_IMAGE}:${DOCKER_TAG}" >> $GITHUB_OUTPUT
          echo "Using Docker image: ${DOCKER_IMAGE}:${DOCKER_TAG}"

  build:
    needs: setup
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.setup.outputs.docker_image }}
    
    outputs:
      is_release: ${{ steps.version.outputs.is_release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      nro_filename: ${{ steps.version.outputs.nro_filename }}
      source_archive: ${{ steps.version.outputs.source_archive }}
      build_archive: ${{ steps.version.outputs.build_archive }}

    steps:
      - name: Validate release inputs
        if: github.event.inputs.release == 'true'
        run: |
          if [ -z "${{ github.event.inputs.version }}" ]; then
            echo "Error: Version is required when creating a release"
            exit 1
          fi
          if ! echo "${{ github.event.inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Version must be in format x.y.z (e.g., 5.0.0)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Determine version and repository
        id: version
        env:
          INPUT_RELEASE: ${{ github.event.inputs.release }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "Debug: INPUT_RELEASE='${INPUT_RELEASE}'"
          echo "Debug: INPUT_VERSION='${INPUT_VERSION}'"
          echo "Debug: GITHUB_REF='${GITHUB_REF}'"
          echo "Debug: GITHUB_REPOSITORY='${GITHUB_REPOSITORY}'"
          
          IS_RELEASE="false"
          VERSION=""
          
          # Check for manual release trigger
          if [ "${INPUT_RELEASE}" = "true" ] && [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
            IS_RELEASE="true"
            echo "Manual release triggered with version: ${VERSION}"
          # Check for tag push
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            IS_RELEASE="true"
            echo "Tag push detected with version: ${VERSION}"
          else
            # Development build - use default version from CMakeLists.txt
            VERSION="5.0.0"
            echo "Development build with default version: ${VERSION}"
          fi
          
          # Create versioned strings (e.g., 5-0-1 for filenames)
          VERSION_DASHED=$(echo "${VERSION}" | tr '.' '-')
          NRO_FILENAME="NX-Shell-v${VERSION_DASHED}.nro"
          SOURCE_ARCHIVE="NX-Shell-v${VERSION_DASHED}-source.tar.gz"
          BUILD_ARCHIVE="NX-Shell-v${VERSION_DASHED}-build.tar.gz"
          
          # Extract repository owner and name for update checks (allows forks to check their own releases)
          REPO_OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          
          echo "is_release=${IS_RELEASE}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_dashed=${VERSION_DASHED}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "repo_owner=${REPO_OWNER}" >> $GITHUB_OUTPUT
          echo "repo_name=${REPO_NAME}" >> $GITHUB_OUTPUT
          echo "nro_filename=${NRO_FILENAME}" >> $GITHUB_OUTPUT
          echo "source_archive=${SOURCE_ARCHIVE}" >> $GITHUB_OUTPUT
          echo "build_archive=${BUILD_ARCHIVE}" >> $GITHUB_OUTPUT
          echo "cmake_version_flag=-DPROJECT_VERSION_OVERRIDE=${VERSION}" >> $GITHUB_OUTPUT
          
          # Release builds don't show -dev suffix
          if [ "${IS_RELEASE}" = "true" ]; then
            echo "cmake_release_flag=-DRELEASE_BUILD=ON" >> $GITHUB_OUTPUT
          else
            echo "cmake_release_flag=" >> $GITHUB_OUTPUT
          fi
          
          echo "Build: version=${VERSION}, nro=${NRO_FILENAME}, release=${IS_RELEASE}"

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            ${{ steps.version.outputs.cmake_version_flag }} \
            ${{ steps.version.outputs.cmake_release_flag }} \
            -DGITHUB_REPO_OWNER=${{ steps.version.outputs.repo_owner }} \
            -DGITHUB_REPO_NAME=${{ steps.version.outputs.repo_name }}

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Create source archive
        if: ${{ !env.ACT || env.CREATE_BUNDLE == 'true' }}
        run: |
          tar -czvf "build/${{ steps.version.outputs.source_archive }}" \
            --exclude='.git' --exclude='build' --exclude='*.nro' --exclude='.github' \
            source/ include/ res/ CMakeLists.txt dependencies.json icon.jpg LICENSE README.md

      - name: Create build archive
        if: ${{ !env.ACT || env.CREATE_BUNDLE == 'true' }}
        run: |
          tar -czvf "/tmp/${{ steps.version.outputs.build_archive }}" --exclude='.git' --exclude='*.tar.gz' .
          mv "/tmp/${{ steps.version.outputs.build_archive }}" build/

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v6
        if: ${{ !env.ACT }}
        with:
          name: NX-Shell
          path: build/${{ steps.version.outputs.nro_filename }}
          if-no-files-found: error

      - name: Upload source archive artifact
        uses: actions/upload-artifact@v6
        if: ${{ !env.ACT }}
        with:
          name: NX-Shell-source
          path: build/${{ steps.version.outputs.source_archive }}
          if-no-files-found: error

      - name: Upload build archive artifact
        uses: actions/upload-artifact@v6
        if: ${{ !env.ACT }}
        with:
          name: NX-Shell-build
          path: build/${{ steps.version.outputs.build_archive }}
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download NRO artifact
        uses: actions/download-artifact@v7
        with:
          name: NX-Shell
          path: dist/

      - name: Download source archive artifact
        uses: actions/download-artifact@v7
        with:
          name: NX-Shell-source
          path: dist/

      - name: Download build archive artifact
        uses: actions/download-artifact@v7
        with:
          name: NX-Shell-build
          path: dist/

      - name: Generate changelog
        run: |
          NRO_FILENAME="${{ needs.build.outputs.nro_filename }}"
          SOURCE_ARCHIVE="${{ needs.build.outputs.source_archive }}"
          BUILD_ARCHIVE="${{ needs.build.outputs.build_archive }}"
          
          # Check for previous tag to generate changelog
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "**Changes since ${PREV_TAG}:**" > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges >> RELEASE_NOTES.md || true
            echo "" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
          fi
          
          echo "**Installation**" >> RELEASE_NOTES.md
          echo "1. Download \`${NRO_FILENAME}\`" >> RELEASE_NOTES.md
          echo "2. Copy to \`/switch/NX-Shell/\` on your SD card (any location works)" >> RELEASE_NOTES.md
          echo "3. Launch from the Homebrew Menu" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "**Additional Downloads**" >> RELEASE_NOTES.md
          echo "- \`${SOURCE_ARCHIVE}\` - Source code archive" >> RELEASE_NOTES.md
          echo "- \`${BUILD_ARCHIVE}\` - Full repository snapshot after build (source + all generated files)" >> RELEASE_NOTES.md
          
          cat RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NX-Shell ${{ needs.build.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            dist/${{ needs.build.outputs.nro_filename }}
            dist/${{ needs.build.outputs.source_archive }}
            dist/${{ needs.build.outputs.build_archive }}
          fail_on_unmatched_files: true
