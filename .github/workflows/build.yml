name: Build NX-Shell

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # devkitpro/devkita64:latest already includes all common Switch libraries
      # No need to install packages - this avoids rate limiting from pkg.devkitpro.org

      - name: Clean build directory
        run: make clean || true

      - name: Build
        run: make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: ${{ !env.ACT }}
        with:
          name: NX-Shell
          path: NX-Shell.nro
          if-no-files-found: error
