name: Build NX-Shell

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Submodules are optional now - CMake FetchContent handles dependencies
        with:
          submodules: false

      # devkitpro/devkita64:latest already includes all common Switch libraries
      # No need to install packages - this avoids rate limiting from pkg.devkitpro.org

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      # Copy NRO to root directory for act/deploy.ps1 compatibility
      # CMakeLists.txt also copies it, but this ensures it's in the right place for act
      - name: Copy NRO to root (for act/deploy.ps1)
        run: |
          cp build/NX-Shell.nro NX-Shell.nro || true
          ls -lh NX-Shell.nro || echo "NRO file not found in build directory"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: ${{ !env.ACT }}
        with:
          name: NX-Shell
          path: build/NX-Shell.nro
          if-no-files-found: error
